# Runs the whole app: http://localhost:8080
#   docker compose up --build
services:
  backend:
    build: ./backend
    environment:
      PORT: "8080"
    # Only reachable from the frontend container; publish a port to call it directly:
    # ports: ["8081:8080"]

  frontend:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - backend
