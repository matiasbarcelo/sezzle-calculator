# Tests both layers, then publishes the React frontend to GitHub Pages at
# https://calculator.matiasbarcelo.com.
#
# GitHub Pages only serves static files, so the Go API must be hosted
# separately. Set the repository variable API_URL (Settings → Secrets and
# variables → Actions → Variables) to its base URL, e.g.
# https://your-api-host.example.com/api/v1, and start the API with
# ALLOWED_ORIGIN=https://calculator.matiasbarcelo.com.
name: Test and deploy to GitHub Pages

on:
  push:
    branches: [technical-assessment]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Backend tests
        working-directory: backend
        run: go test ./... -cover

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm run coverage

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.API_URL }}
        run: |
          npm ci
          npm run build
          echo "calculator.matiasbarcelo.com" > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://calculator.matiasbarcelo.com
    steps:
      - uses: actions/deploy-pages@v4
